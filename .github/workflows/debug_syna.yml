name: Debug Syna HTML (temporary)

# Temporary: dumps the raw HTML of the Syna page (through the same WireGuard
# proxy and downloader as the real check) so the CSS selector can be fixed.
# Delete this workflow once csv/bezirk_horgen.csv is fixed.

on:
  push:
    branches:
      - ccr-9c1a3493-t4h7z0
    paths:
      - .github/workflows/debug_syna.yml
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Setup WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          echo "${{ secrets.WIREGUARD_CONFIG }}" | base64 -d > wg0.conf
          chmod 600 wg0.conf
          sed -i '/^DNS/d' wg0.conf
          sudo mv wg0.conf /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo ip rule add to 8.8.8.8/32 lookup main priority 100
          sudo ip rule add to 8.8.4.4/32 lookup main priority 101
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\nnameserver 8.8.4.4\n' | sudo tee /etc/resolv.conf > /dev/null
          for i in {1..15}; do
            ping -c 1 -W 2 1.1.1.1 > /dev/null 2>&1 || true
            handshake=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
            if [ -n "$handshake" ] && [ "$handshake" -gt 0 ]; then break; fi
            sleep 2
            [ $i -eq 15 ] && { echo "No WireGuard handshake"; exit 1; }
          done

      - name: Dump HTML
        run: |
          mkdir -p debug
          URL="https://syna.ch/zuerich-schaffhausen/zhsh-aktuell"
          # Same downloader as the real check (requests, browser-like headers)
          uv run python -c "
          import sys
          sys.path.insert(0, 'lib')
          import download
          open('debug/syna_requests.html', 'w', encoding='utf-8').write(download.download('$URL'))
          " || echo "requests download failed"
          # Plain curl for comparison (shows status and headers)
          curl -sS -L -D debug/syna_curl_headers.txt \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -o debug/syna_curl.html "$URL" || echo "curl failed"
          ls -la debug
          head -c 3000 debug/syna_curl_headers.txt
          for f in debug/syna_requests.html debug/syna_curl.html; do
            echo "=================== $f ($(wc -c < $f) bytes)"
            cat $f
          done

      - name: Stop WireGuard
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          sudo shred -u /etc/wireguard/wg0.conf 2>/dev/null || sudo rm -f /etc/wireguard/wg0.conf

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: syna-debug
          path: debug
